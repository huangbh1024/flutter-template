name: Flutter Debug APK

# 用途：本地无法连设备时，用 CI 产出「自带屏内调试面板」的安装包。
# 规则（详见 docs/DEBUG.md）：
# - 只构建 profile 模式：kReleaseMode=false，ISpect 面板可用；
# - 必须带 --dart-define=ISPECT_ENABLED=true —— ISpect 的开关是编译期常量，
#   运行时无法打开；
# - 手动触发，或推送到 debug/** 分支；main 的正式产物与 tag 发布完全不受影响；
# - profile 使用 debug 签名：与 main 的 release 包签名不同，安装前先卸载旧包。

on:
  workflow_dispatch:
  push:
    branches:
      - 'debug/**'

permissions:
  contents: read

concurrency:
  group: flutter-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

  debug-apk:
    name: build-debug-apk
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: ./.github/actions/setup-flutter

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Pub get
        run: flutter pub get

      - name: Build profile APK with ISpect
        run: >-
          flutter build apk --profile
          --dart-define=ISPECT_ENABLED=true
          --target-platform android-arm64

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-debug-apk-${{ github.run_number }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
