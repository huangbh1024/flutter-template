name: Release

# 推送 v* tag 时构建 Android APK 与 iOS IPA，并创建 GitHub Release。
# 规则（详见 docs/CI.md）：
# - tag 去掉前缀 v 后必须与 pubspec.yaml 的 version（不含 +build）一致；
# - 发布产物必须是正式签名，缺少签名 secrets 时直接失败，避免发布不可安装的包；
# - 签名导入与校验复用 .github/actions/android-signing / ios-signing。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: check-version
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches pubspec version
        run: |
          PUBSPEC_VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | head -n1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$PUBSPEC_VERSION" ] || [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 pubspec.yaml 的版本 $PUBSPEC_VERSION 不一致"
            exit 1
          fi
          echo "版本一致：$PUBSPEC_VERSION"

  android:
    name: build-android
    needs: check-version
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: ./.github/actions/setup-flutter

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Pub get
        run: flutter pub get

      - name: Import signing assets
        uses: ./.github/actions/android-signing
        with:
          required: 'true'

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  ios:
    name: build-ios
    needs: check-version
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: Pub get
        run: flutter pub get

      - name: Import signing assets
        uses: ./.github/actions/ios-signing
        with:
          required: 'true'
          export-method: ${{ env.IOS_EXPORT_METHOD }}

      - name: Build IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: publish
    needs: [android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 本 job 没有 checkout，工作目录不是 git 仓库；gh 只认 GH_REPO，
          # 不会读 GITHUB_REPOSITORY，缺了这一行会报 "not a git repository"。
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/*.ipa --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*.apk dist/*.ipa
          fi
