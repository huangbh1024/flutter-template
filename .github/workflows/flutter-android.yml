name: Flutter Android

# 规则（详见 docs/CI.md）：
# - PR 只做检查（format / analyze / test），不打包；
# - PR 合并进 main（push main）后才构建 release APK 并上传 Artifact；
# - 只改文档等非代码文件时，合入 main 不触发构建（paths-ignore）；
# - pull_request 不过滤路径，保证 verify 始终上报（分支保护必需检查）；
# - tag（v*）发布走 release.yml。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.idea/**'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-android-${{ github.ref }}
  # PR 上取消旧运行省时间；main 上的出包构建保留，避免产物缺失。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # analyze 不检查格式；放在最后，先暴露 analyze / test 的问题。
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

  # ---------- 以下只在合并进 main 或手动触发时执行 ----------
  android:
    name: build-android
    needs: verify
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: ./.github/actions/setup-flutter

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Pub get
        run: flutter pub get

      - name: Prepare signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::未配置签名 secrets，本次使用 debug 签名（仅适合内测）"
            echo "签名：未配置 secrets，本次为 **debug 签名**，仅适合内测。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS
          echo "签名：使用仓库配置的 **release 签名**。" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-android-${{ github.run_number }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
