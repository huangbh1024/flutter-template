name: Flutter iOS

# 规则：
# - iOS 只在合并进 main 或手动触发时构建（macOS runner 约 10 倍费用）；
# - PR 阶段不跑 iOS 构建，只由 Android 工作流的 verify 做代码检查；
# - 配置了 iOS 签名 secrets 时导出签名 IPA，否则产出未签名 IPA 仅用于验证构建；
# - 只改文档等非代码文件时，合入 main 不触发构建（paths-ignore）。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.idea/**'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: build-ios
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      # Settings → Secrets and variables → Actions → Variables 配置；
      # 常用值：app-store-connect / release-testing / ad-hoc / development
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Import signing assets (optional)
        if: env.IOS_CERTIFICATE_BASE64 != ''
        run: |
          KEYCHAIN=build.keychain-db
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/template.mobileprovision

      - name: Build signed IPA
        if: env.IOS_CERTIFICATE_BASE64 != ''
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$IOS_EXPORT_METHOD</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Build unsigned app (no signing secrets)
        if: env.IOS_CERTIFICATE_BASE64 == ''
        run: |
          echo "::notice::未配置 iOS 签名 secrets，产出未签名 IPA（仅验证构建，不能安装或上架）"
          flutter build ios --release --no-codesign
          mkdir -p build/ios/unsigned-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned-ipa/Payload/
          (cd build/ios/unsigned-ipa && zip -qry app-unsigned.ipa Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-ios-${{ github.run_number }}-${{ github.sha }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/unsigned-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
