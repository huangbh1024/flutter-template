# 静态检查配置。CLAUDE.md 要求 `dart format` 无 diff、`flutter analyze` 零 issue。
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    # 代码生成产物不参与检查。
    - '**/*.g.dart'
    - '**/*.freezed.dart'

linter:
  rules:
    # 模板默认使用官方 lint 集，以下是团队附加约定。
    # 新增规则前先修完存量问题，避免 verify 一直红。
    - prefer_single_quotes
    - unawaited_futures
    # 需要 Riverpod 专属检查时再引入 riverpod_lint + custom_lint。
